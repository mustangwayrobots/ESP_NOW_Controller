name: Compile and Deploy Firmware

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI & Add ESP32 Core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Pull Central Custom Libraries
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mustangwayrobots/arduino-libraries.git /home/runner/Arduino/libraries

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir ./build .

      - name: Prepare Files for Web Flasher
        run: |
          cp ./build/*.ino.merged.bin ./firmware.bin

      - name: Inject Dynamic Version into Manifest
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M")
          VERSION_STRING="Build: $BUILD_DATE UTC"
          jq --arg ver "$VERSION_STRING" '.version = $ver' ./flash/manifest.json > ./flash/manifest.json.tmp && mv ./flash/manifest.json.tmp ./flash/manifest.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
